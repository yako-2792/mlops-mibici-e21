[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_e21"
version = "0.0.1"
description = "Proyecto de MLOps para el sistema de bicicletas compartidas MiBici - Equipo 21"
authors = [
  { name = "e21" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "huggingface-hub>=2.2.0",
    "loguru",
    "matplotlib>=3.11.2",
    "mlflow>=1.27.0",
    "pandas>=3.0.6",
    "pip",
    "pyarrow>=26.0.0",
    "pytest",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "scikit-learn>=1.9.1",
    "tqdm",
    "typer",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["mibici_e21"]
include = ["pyproject.toml", "mibici_e21/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_e21"]
force-sort-within-sections = true

