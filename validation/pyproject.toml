[project]
name = "mibici-e21-data-validation"
version = "0.0.1"
description = "Isolated environment for the DeepChecks data validation of mibici_e21"
requires-python = "~=3.11.0"
# DeepChecks 0.19, its latest release, still uses APIs removed in NumPy 2, pandas 2.3,
# scikit-learn 1.7, and setuptools 81, so it cannot share the project environment.
dependencies = [
    "deepchecks==0.19.1",
    "loguru>=0.7.3",
    "matplotlib>=3.9,<3.10",
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "pytest>=8",
    "pyarrow>=17,<20",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.6,<1.7",
    "setuptools<81",
]

[tool.uv]
package = false
