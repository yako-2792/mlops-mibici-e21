[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_e21"
version = "0.0.1"
description = "Proyecto de MLOps para el sistema de bicicletas compartidas MiBici - Equipo 21"
authors = [
  { name = "e21" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "huggingface-hub>=2.2.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]
requires-python = "~=3.11.0"

[tool.uv]
# The code runs from the project root, so uv installs only the locked dependencies.
# This also lets `mlflow run --env-manager uv` rebuild the environment from uv.lock alone.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]


[tool.ruff]
line-length = 99
src = ["mibici_e21"]
include = ["pyproject.toml", "mibici_e21/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_e21"]
force-sort-within-sections = true

